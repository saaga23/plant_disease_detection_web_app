[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plant-disease-detection-web-app"
version = "0.2.0"
description = "Educational Streamlit app for plant disease and pest image classification"
readme = "README.md"
requires-python = ">=3.9,<3.14"
license = { text = "MIT" }
authors = [{ name = "Sunday Aspita Abraham" }]
dependencies = [
    "streamlit>=1.36",
    "pillow>=10.0",
    "numpy>=1.26",
    "pandas>=2.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]
mysql = ["mysql-connector-python>=8.0"]
openai = ["openai>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
