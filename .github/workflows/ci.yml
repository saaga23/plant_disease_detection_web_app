name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true   # the two .h5 model files are Git LFS artifacts

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Lint (ruff)
        run: ruff check src scripts tests app.py

      - name: Validate model manifest and artifacts (checksums + load + smoke inference)
        run: python scripts/validate_models.py

      - name: Unit and smoke tests
        run: python -m pytest tests/unit tests/smoke

      - name: Integration tests (real model inference)
        run: python -m pytest tests/integration

      - name: Secret scan (Gitleaks, pinned major)
        uses: gitleaks/gitleaks-action@v2 # pinned: v2 -> dcedce43c6f43de0b836d1fe38946645c9c638dc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Project-specific credential pattern scan
        run: |
          python - <<'EOF'
          import re, sys, pathlib
          root = pathlib.Path(".")
          offenders = []
          pattern = re.compile(r"(password|api_key|secret|token)\s*=\s*[\"'][^\"']{6,}[\"']", re.I)
          # scans ALL tracked application files; legacy_* copies are included
          # because their rotated credential value is redacted (commit 205a10c)
          for p in root.rglob("*.py"):
              if any(part in {".git", ".venv", "venv", "node_modules"} for part in p.parts):
                  continue
              text = p.read_text(encoding="utf-8", errors="replace")
              for m in pattern.finditer(text):
                  offenders.append(f"{p}: {m.group(0)[:40]}...")
          if offenders:
              print("\n".join(offenders))
              sys.exit(1)
          print("secret scan: clean")
          EOF

  summary:
    needs: test
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Report
        run: echo "CI finished for matrix ${{ needs.test.result }}"
